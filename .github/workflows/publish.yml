# Publishes the version in package.json to npmjs and to GitHub Packages when a
# `v*` tag is pushed:  git tag v1.0.0 && git push origin v1.0.0
#
# npmjs needs the repository secret NPM_TOKEN (an automation token with publish
# rights on the @skaile-ai scope); the run fails before publishing anything when
# it is missing, so a release always reaches both registries. GitHub Packages uses the workflow's own
# GITHUB_TOKEN, which can publish only a package whose scope equals the owner of
# this repository (@skaile-ai → the skaile-ai organisation).
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Release preconditions (tag = package.json version, NPM_TOKEN set)
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "secret NPM_TOKEN is missing: a release publishes to npmjs and GitHub Packages" >&2
            exit 1
          fi

      # `prepare` builds dist/ during install; the explicit build keeps the
      # step visible and fails the run if the output is missing.
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npmjs
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/npmrc-npmjs"
          npm publish --access public --userconfig "$RUNNER_TEMP/npmrc-npmjs" --registry https://registry.npmjs.org

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmrc-github"
          npm publish --access public --userconfig "$RUNNER_TEMP/npmrc-github" --registry https://npm.pkg.github.com
